name: Godot CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  validate:
    name: Validate Godot Project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import and validate project
        run: godot --headless --path . --import

      - name: Smoke test game startup
        run: |
          if grep -Eq '^run/main_scene[[:space:]]*=[[:space:]]*"[^"[:space:]]+"' project.godot; then
            godot --headless --path . --quit-after 10
          else
            echo "::notice::Smoke test skipped: project.godot has no main scene yet."
          fi

  tests:
    name: Run Godot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        run: godot --headless --path . --import

      - name: Run standalone tests
        run: |
          mapfile -d '' test_files < <(find test -type f -name '*_test.gd' -print0 | sort -z)
          if [ ${#test_files[@]} -eq 0 ]; then
            echo "::notice::Tests skipped: no test/**/*_test.gd files found."
            exit 0
          fi

          status=0
          for test_file in "${test_files[@]}"; do
            echo "::group::${test_file}"
            godot --headless --path . --script "$test_file" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find GDScript files
        id: scripts
        run: |
          if [ -n "$(git ls-files -- '*.gd')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Lint and formatting skipped: no GDScript files found."
          fi

      - name: Install GDScript tools
        if: steps.scripts.outputs.found == 'true'
        run: python -m pip install "gdtoolkit==4.5.0"

      - name: Lint GDScript
        if: steps.scripts.outputs.found == 'true'
        run: git ls-files -z -- '*.gd' | xargs -0 -r python -m gdtoolkit.linter
