name: Godot CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "gdtoolkit==4.5.0"
      - name: Lint tracked scripts
        run: git ls-files -z -- '*.gd' ':(exclude)addons/**' | xargs -0 -r python -m gdtoolkit.linter

  validate:
    name: Validate Godot Project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Remove local Godot AI configuration
        shell: bash
        run: |
          # The local editor plugin recreates this entry, but its addon is not shipped.
          sed -i '\|^_mcp_game_helper="\*res://addons/godot_ai/runtime/game_helper\.gd"[[:space:]]*$|d' project.godot
          # Remove only this local plugin, preserving Dialogic and other plugins.
          sed -i '/^enabled=PackedStringArray(/ { s|"res://addons/godot_ai/plugin.cfg", ||g; s|, "res://addons/godot_ai/plugin.cfg"||g; s|"res://addons/godot_ai/plugin.cfg"||g; }' project.godot
      - uses: lihop/setup-godot@v3
        with:
          version: 4.7.2-stable
      - name: Import project and run gameplay tests
        shell: bash
        run: |
          set -euo pipefail

          check_godot() {
            local limit="$1"
            shift
            # Bash also supports setup-godot's launcher without a shebang.
            timeout "$limit" bash -c 'godot --headless --path . "$@"' _ "$@" 2>&1 | tee "$RUNNER_TEMP/godot.log"
            if grep -Eq 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/godot.log"; then
              echo "::error::Godot reported an error; see the log above."
              exit 1
            fi
          }

          check_godot 300s --editor --import --quit
          while IFS= read -r -d '' test; do
            echo "Running $test"
            check_godot 60s --script "$test"
          done < <(find test gameplay/charms -type f -name '*_test.gd' -print0 | sort -z)
