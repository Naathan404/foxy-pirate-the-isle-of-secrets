name: Godot CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "gdtoolkit==4.5.0"
      - name: Lint tracked scripts
        run: git ls-files -z -- '*.gd' ':(exclude)addons/**' | xargs -0 -r python -m gdtoolkit.linter

  validate:
    name: Validate Godot Project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Remove local Godot AI configuration
        shell: bash
        run: |
          # The local editor plugin recreates this entry, but its addon is not shipped.
          sed -i '/^<<<<<<<HEAD_mcp_game_helper=/d' project.godot
          sed -i '/^<<<<<<<HEADenabled=.*godot_ai\/plugin.cfg/d' project.godot
          sed -i '/^<<<<<<<HEADcharm_slot_q=/,/^}/d' project.godot
          sed -i '\|addons/godot_ai/runtime/game_helper\.gd|d' project.godot
          # Remove only this local plugin, preserving Dialogic and other plugins.
          sed -i 's|"res://addons/godot_ai/plugin.cfg", ||g; s|, "res://addons/godot_ai/plugin.cfg"||g; s|"res://addons/godot_ai/plugin.cfg"||g' project.godot
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' project.godot; then
            echo "::error::project.godot contains merge conflict markers"
            exit 1
          fi
      - uses: lihop/setup-godot@v3
        with:
          version: 4.7.2-stable
      - name: Import project and run fixed tests
        shell: bash
        run: |
          set -euo pipefail

          check_godot() {
            local limit="$1"
            shift
            # Bash also supports setup-godot's launcher without a shebang.
            timeout "$limit" bash -c 'godot --headless --path . "$@"' _ "$@" 2>&1 | tee "$RUNNER_TEMP/godot.log"
            # Godot's editor debugger can emit this lifecycle error on shutdown:
            # https://github.com/godotengine/godot/issues/117243
            # Keep all other Godot errors fatal.
            if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/godot.log" | grep -Ev '^ERROR: Plugin is not attached to debugger\.$'; then
              echo "::error::Godot reported an error; see the log above."
              exit 1
            fi
          }

          check_godot 300s --editor --import --quit
          # Keep CI membership explicit; new test files must not run automatically.
          while IFS= read -r test || [[ -n "$test" ]]; do
            [[ -z "$test" || "$test" == \#* ]] && continue
            if [[ ! -f "$test" ]]; then
              echo "::error::Listed CI test does not exist: $test"
              exit 1
            fi
            echo "Running $test"
            check_godot 60s --script "$test"
          done < .github/godot-tests.txt
